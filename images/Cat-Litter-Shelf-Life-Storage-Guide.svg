<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" role="img" aria-labelledby="ttl desc">
<title id="ttl">Cat litter shelf life and storage guide</title>
<desc id="desc">A sealed bag of cat litter with a clock showing time passing, a badge reading 24 months shelf life, and a cool dry storage badge, representing how long unopened cat litter lasts in storage.</desc>
<defs>
  <linearGradient id="bgSL" x1="0" y1="0" x2="820" y2="440" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFF8EE"/>
    <stop offset="1" stop-color="#FFF1DC"/>
  </linearGradient>
  <linearGradient id="glowSL" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7C3AED" stop-opacity=".16"/>
    <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="bagSL" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8B5CF6"/>
    <stop offset="1" stop-color="#5B21B6"/>
  </linearGradient>
  <filter id="softSL" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#3C1361" flood-opacity=".18"/>
  </filter>
</defs>

<rect width="820" height="440" fill="url(#bgSL)"/>
<circle cx="740" cy="70" r="220" fill="url(#glowSL)"/>
<circle cx="70" cy="390" r="200" fill="url(#glowSL)"/>

<!-- floor -->
<line x1="60" y1="378" x2="760" y2="378" stroke="#ecdfce" stroke-width="2"/>

<!-- sealed bag -->
<g filter="url(#softSL)">
  <path d="M190 160 h180 a16 16 0 0 1 16 16 v150 a30 30 0 0 1 -30 30 h-152 a30 30 0 0 1 -30 -30 v-150 a16 16 0 0 1 16 -16 z" fill="url(#bagSL)"/>
  <rect x="250" y="130" width="60" height="40" rx="10" fill="#5B21B6"/>
  <rect x="190" y="200" width="212" height="14" fill="#ffffff" opacity=".9"/>
  <text x="296" y="211" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="800" fill="#5B21B6">SEALED</text>
  <g fill="#ffffff" opacity=".85">
    <circle cx="240" cy="290" r="5"/>
    <circle cx="265" cy="305" r="5"/>
    <circle cx="290" cy="285" r="5"/>
    <circle cx="315" cy="300" r="5"/>
    <circle cx="340" cy="288" r="5"/>
    <circle cx="255" cy="320" r="5"/>
    <circle cx="300" cy="325" r="5"/>
    <circle cx="330" cy="315" r="5"/>
  </g>
</g>

<!-- clock -->
<g transform="translate(430,130)" filter="url(#softSL)">
  <circle cx="60" cy="60" r="60" fill="#ffffff"/>
  <circle cx="60" cy="60" r="60" fill="none" stroke="#F7941D" stroke-width="8"/>
  <line x1="60" y1="60" x2="60" y2="24" stroke="#3C1361" stroke-width="7" stroke-linecap="round"/>
  <line x1="60" y1="60" x2="88" y2="72" stroke="#3C1361" stroke-width="7" stroke-linecap="round"/>
  <circle cx="60" cy="60" r="6" fill="#F7941D"/>
</g>

<!-- shelf-life badge -->
<g transform="translate(470,260)">
  <rect x="0" y="0" width="190" height="64" rx="32" fill="#3C1361"/>
  <text x="95" y="27" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="800" fill="#FFD9A0">24 MONTHS</text>
  <text x="95" y="47" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#F3ECFF">Typical shelf life, sealed</text>
</g>

<!-- cool & dry storage badge -->
<g transform="translate(150,340)" filter="url(#softSL)">
  <rect x="0" y="0" width="200" height="56" rx="28" fill="#34B983"/>
  <path d="M26 28 a10 10 0 1 1 20 0" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <rect x="31" y="22" width="10" height="16" rx="5" fill="#ffffff"/>
  <text x="120" y="33" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">Store Cool &amp; Dry</text>
</g>
</svg>
