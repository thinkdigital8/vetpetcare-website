<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" role="img" aria-labelledby="ttl desc">
<title id="ttl">Private label and OEM cat litter manufacturing in India</title>
<desc id="desc">Two cat litter export bags side by side — one plain OEM bag and one customized with a brand's own logo and fragrance label — representing private label manufacturing for global pet brands.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="820" y2="440" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFF8EE"/>
    <stop offset="1" stop-color="#FFF1DC"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7C3AED" stop-opacity=".16"/>
    <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="bagPlain" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#EDE7DD"/>
    <stop offset="1" stop-color="#DCD3C4"/>
  </linearGradient>
  <linearGradient id="bagBrand" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8B5CF6"/>
    <stop offset="1" stop-color="#4C1D95"/>
  </linearGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#3C1361" flood-opacity=".18"/>
  </filter>
</defs>

<rect width="820" height="440" fill="url(#bg)"/>
<circle cx="700" cy="70" r="240" fill="url(#glow)"/>
<circle cx="90" cy="380" r="180" fill="url(#glow)"/>

<!-- OEM plain bag -->
<g filter="url(#soft)">
  <rect x="150" y="120" width="170" height="230" rx="18" fill="url(#bagPlain)" stroke="#C9BCA5" stroke-width="2"/>
  <rect x="150" y="120" width="170" height="46" rx="18" fill="#D8CBB4"/>
  <rect x="150" y="150" width="170" height="16" fill="#D8CBB4"/>
  <circle cx="235" cy="143" r="6" fill="#B8A98B"/>
  <rect x="178" y="200" width="114" height="88" rx="10" fill="#F7F3EA" stroke="#C9BCA5" stroke-width="1.5"/>
  <text x="235" y="238" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="700" fill="#6b5d55">GENERIC</text>
  <text x="235" y="258" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#8a7d70">Unbranded OEM Bag</text>
  <text x="235" y="316" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="700" fill="#8a7d70">5KG / 25KG</text>
</g>

<!-- arrow -->
<g stroke="#F7941D" stroke-width="4" fill="none" stroke-linecap="round">
  <path d="M330 235 h58"/>
  <path d="M372 220 l18 15 l-18 15"/>
</g>

<!-- Branded bag -->
<g filter="url(#soft)">
  <rect x="410" y="105" width="180" height="245" rx="20" fill="url(#bagBrand)"/>
  <rect x="410" y="105" width="180" height="50" rx="20" fill="#6D28D9"/>
  <rect x="410" y="138" width="180" height="17" fill="#6D28D9"/>
  <circle cx="500" cy="130" r="6" fill="#C4B5FD"/>
  <rect x="437" y="188" width="126" height="96" rx="12" fill="#ffffff"/>
  <text x="500" y="228" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="800" fill="#3C1361">YOUR</text>
  <text x="500" y="248" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="800" fill="#3C1361">BRAND</text>
  <text x="500" y="268" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="10.5" fill="#7C3AED">Custom Logo Here</text>
  <text x="500" y="318" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#F3ECFF">PRIVATE LABEL</text>
  <text x="500" y="336" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#D9CCF5">6 Fragrances · 5KG / 25KG</text>
</g>

<!-- Made in India ribbon -->
<g transform="translate(60,60)">
  <rect x="0" y="0" width="188" height="34" rx="17" fill="#3C1361"/>
  <text x="94" y="22" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFD9A0">🇮🇳 Manufactured in India</text>
</g>

<g transform="translate(560,60)">
  <rect x="0" y="0" width="200" height="34" rx="17" fill="#F7941D"/>
  <text x="100" y="22" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1200">OEM · Private Label Ready</text>
</g>
</svg>
