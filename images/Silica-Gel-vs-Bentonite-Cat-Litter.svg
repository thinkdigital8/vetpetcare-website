<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" role="img" aria-labelledby="ttl desc">
<title id="ttl">Silica gel vs bentonite cat litter comparison</title>
<desc id="desc">Two cat litter bags side by side — one silica gel crystal litter and one natural bentonite clumping clay litter — with a versus badge between them, representing a head-to-head litter comparison.</desc>
<defs>
  <linearGradient id="bg4" x1="0" y1="0" x2="820" y2="440" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFF8EE"/>
    <stop offset="1" stop-color="#FFF1DC"/>
  </linearGradient>
  <linearGradient id="glow4" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7C3AED" stop-opacity=".16"/>
    <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="silicaBag" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#60A5FA"/>
    <stop offset="1" stop-color="#1E40AF"/>
  </linearGradient>
  <linearGradient id="bentoBag" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F7941D"/>
    <stop offset="1" stop-color="#C96A00"/>
  </linearGradient>
  <filter id="soft4" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#3C1361" flood-opacity=".18"/>
  </filter>
</defs>

<rect width="820" height="440" fill="url(#bg4)"/>
<circle cx="90" cy="70" r="200" fill="url(#glow4)"/>
<circle cx="740" cy="390" r="220" fill="url(#glow4)"/>

<!-- Silica bag -->
<g filter="url(#soft4)">
  <rect x="130" y="120" width="190" height="250" rx="20" fill="url(#silicaBag)"/>
  <rect x="130" y="120" width="190" height="52" rx="20" fill="#2563EB"/>
  <rect x="130" y="156" width="190" height="18" fill="#2563EB"/>
  <circle cx="225" cy="146" r="6" fill="#BFDBFE"/>
  <rect x="155" y="204" width="140" height="100" rx="12" fill="#ffffff"/>
  <text x="225" y="242" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="800" fill="#1E40AF">SILICA GEL</text>
  <text x="225" y="262" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="10.5" fill="#3B82F6">Crystal Litter</text>
  <!-- crystal dots -->
  <g fill="#93C5FD">
    <rect x="170" y="278" width="14" height="14" rx="3"/>
    <rect x="192" y="284" width="12" height="12" rx="3"/>
    <rect x="214" y="276" width="16" height="16" rx="3"/>
    <rect x="240" y="284" width="12" height="12" rx="3"/>
    <rect x="262" y="278" width="14" height="14" rx="3"/>
  </g>
  <text x="225" y="340" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#EFF6FF">Absorbs moisture</text>
</g>

<!-- VS badge -->
<g transform="translate(370,215)">
  <circle cx="40" cy="40" r="40" fill="#3C1361"/>
  <text x="40" y="50" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFD9A0">VS</text>
</g>

<!-- Bentonite bag -->
<g filter="url(#soft4)">
  <rect x="500" y="120" width="190" height="250" rx="20" fill="url(#bentoBag)"/>
  <rect x="500" y="120" width="190" height="52" rx="20" fill="#B4590A"/>
  <rect x="500" y="156" width="190" height="18" fill="#B4590A"/>
  <circle cx="595" cy="146" r="6" fill="#FFD9A0"/>
  <rect x="525" y="204" width="140" height="100" rx="12" fill="#ffffff"/>
  <text x="595" y="242" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="800" fill="#3C1361">BENTONITE</text>
  <text x="595" y="262" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="10.5" fill="#8a7d70">Clumping Clay</text>
  <!-- clump shapes -->
  <g fill="#E9D8B8">
    <circle cx="560" cy="284" r="9"/>
    <circle cx="583" cy="290" r="8"/>
    <circle cx="606" cy="282" r="10"/>
    <circle cx="630" cy="290" r="8"/>
  </g>
  <text x="595" y="340" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#FFF3E2">Clumps on contact</text>
</g>
</svg>
